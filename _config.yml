# ============================================================ 站点标识
title: Agents-Research
description: >-
  四个开源 Agent 项目的代码级横向对比研究。按架构层次逐层深入，
  每层一篇对比分析，所有断言标注 `文件:行号` 可回源码核验。
url: https://justineric777.github.io
baseurl: /Agents-Research
lang: zh-CN

# ============================================================ 主题
theme: just-the-docs
color_scheme: light

# ============================================================ Markdown 渲染
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false
  syntax_highlighter: rouge
  # 中文文档里 `——` 之类的破折号不做智能引号替换，保持与源码一致
  smart_quotes: ["apos", "apos", "quot", "quot"]

# ============================================================ 配套插件
plugins:
  - jekyll-seo-tag
  - jekyll-include-cache

# ============================================================ 图表
# 文档里有 20 个 ```mermaid 代码块。主题内置支持会把它们直接渲染成图，
# 无需自建 JS；视觉参数由 _includes/mermaid_config.js 控制。
mermaid:
  version: "11"

# ============================================================ 侧栏与搜索
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  rel_url: true
  button: false
heading_anchors: 2
nav_sort: case_insensitive
nav_fold: false          # 三区父节点默认展开，读者一眼看到全貌

# 目录层级：章节条目在侧栏里不做缩写
nav_external_links_new_tab: true

# ============================================================ 页脚与链接
back_to_top: true
back_to_top_text: "回到顶部"
aux_links:
  "GitHub 仓库":
    - https://github.com/JustinEric777/Agents-Research
aux_links_new_tab: true

footer_content: >-
  <a href="https://github.com/JustinEric777/Agents-Research/blob/master/LICENSE">MIT License</a>
  · 四项目源码对比分析，结论均可回溯至 `文件:行号`

# ============================================================ 构建排除
# README.md 有意不排除：index.md 通过 {% include_relative README.md %} 复用它，
# 保持「一份内容、仓库门面与站点首页同步」。它没有 front matter，Jekyll 只当
# 静态文件复制，不会与 index.md 抢 permalink。
exclude:
  - LICENSE
  - Gemfile
  - Gemfile.lock
  - .gitignore
  - .idea/
  - vendor/
  - node_modules/
